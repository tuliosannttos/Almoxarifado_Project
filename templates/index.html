<!DOCTYPE html>
<html>
<head>
    <title>Previsão de Estoque</title>
</head>
<body>

    <h2>🔎 Buscar Produto</h2>

    <form method="POST">
        <label>Código:</label>
        <input type="text" name="codigo"><br><br>

        <label>Nome:</label>
        <input type="text" name="nome"><br><br>

        <button type="submit">Prever</button>
    </form>

    <hr>

    {% if resultados %}
        <h3>Resultados:</h3>
        <ul>
        {% for r in resultados %}
            <li>
                {{ r.codigo }} - {{ r.produto }} → Previsão: {{ r.previsao }}
            </li>
        {% endfor %}
        </ul>
    {% endif %}

</body>
</html>
